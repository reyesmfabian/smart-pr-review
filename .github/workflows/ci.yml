name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm audit
      # Auxiliary editor windows need a window manager, not only a virtual display.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox
      # pretest compiles and lints.
      - run: xvfb-run -a sh -c 'openbox & npm test'
      - run: npm run package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: smart-pr-review-vsix
          path: vscode/smart-pr-review.vsix
          if-no-files-found: error

  intellij:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: intellij
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Install virtual display for UI interaction tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb
      - run: xvfb-run -a ./gradlew test buildPlugin
        if: runner.os == 'Linux'
        shell: bash
      - run: ./gradlew test buildPlugin
        if: runner.os != 'Linux'
        shell: bash
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: intellij-test-reports-${{ matrix.os }}
          path: intellij/build/reports/tests/test/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: smart-pr-review-intellij-${{ matrix.os }}
          path: intellij/build/distributions/*.zip
          if-no-files-found: error
